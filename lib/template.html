<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129516;</text></svg>"
    />
    <style>
      /* Surfaces, text and borders are CSS system colors, so light and dark
         both work with no palette and no media query — the browser maps
         Canvas/Field/ButtonFace per scheme. Only the accents that carry meaning
         are fixed: one colour per class, one per verdict. */
      :root {
        color-scheme: light dark;
        /* light-dark() rather than a media query, for the same reason the rest
           of the sheet is system colors: one declaration, both schemes. An
           accent picked for white is unreadable on near-black and the other way
           round, and these are borders and text, not decoration. */
        --accent: light-dark(#2563eb, #7aa2f7);
        --real: light-dark(#16a34a, #4ade80);
        --unsure: light-dark(#b45309, #fbbf24);
        --artifact: light-dark(#dc2626, #f87171);
        /* what reads on top of an accent, once the accent is the background */
        --on-accent: light-dark(#fff, #10131a);
      }
      [data-cls='SNV'] {
        --cls: light-dark(#0f766e, #5eead4);
      }
      [data-cls='MNV'] {
        --cls: light-dark(#4d7c0f, #bef264);
      }
      [data-cls='DEL'] {
        --cls: light-dark(#e41a1c, #ff8a8a);
      }
      [data-cls='DUP'] {
        --cls: light-dark(#377eb8, #8cc0f0);
      }
      [data-cls='INS'] {
        --cls: light-dark(#800080, #e08ae0);
      }
      [data-cls='INV'] {
        --cls: light-dark(#ff7f00, #ffb366);
      }
      [data-cls='CNV'] {
        --cls: light-dark(#5c3a1e, #c9a27e);
      }
      [data-cls='BND'] {
        --cls: light-dark(#a65628, #e0a078);
      }
      [data-cls='EVENT'] {
        --cls: light-dark(#0d9488, #5eead4);
      }
      /* JBrowse's Mendelian check colors */
      [data-cls='deNovoCandidate'] {
        --cls: light-dark(#c2185b, #f06292);
      }
      [data-cls='mendelianViolation'] {
        --cls: light-dark(#f57c00, #ffb74d);
      }
      [data-cls='consistent'] {
        --cls: light-dark(#78909c, #b0bec5);
      }
      [data-cls='unsettled'] {
        --cls: GrayText;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      /* Full width and stuck to the top of the viewport, not a floating panel
         inside the column: every control on the page is in here, and a reviewer
         forty cards down needs all of them without scrolling back. */
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: Canvas;
        border-bottom: 1px solid ButtonBorder;
        padding: 10px 20px;
        display: flex;
        gap: 8px 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      .eyebrow {
        font-size: 12px;
        color: GrayText;
      }
      .progress {
        width: 290px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .progress .r {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        color: GrayText;
      }
      .bar {
        height: 6px;
        display: flex;
        border: 1px solid ButtonBorder;
        border-radius: 3px;
        background: ButtonFace;
        overflow: hidden;
      }
      .bar span {
        height: 100%;
      }
      .b-real {
        background: var(--real);
      }
      .b-unsure {
        background: var(--unsure);
      }
      .b-artifact {
        background: var(--artifact);
      }
      .b-accent {
        background: var(--accent);
      }

      /* the filters and the actions, on their own line under the title row */
      .hrow {
        flex-basis: 100%;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .actions {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      button,
      select,
      input {
        font: inherit;
        font-size: 13px;
      }
      input[type='search'] {
        min-width: 280px;
      }
      /* a select is as wide as its longest option, and a facet's can be a
         sentence */
      header select {
        max-width: 250px;
        text-overflow: ellipsis;
      }
      button[aria-pressed='true'] {
        background: var(--cls, var(--accent));
        border: 1px solid var(--cls, var(--accent));
        border-radius: 4px;
        color: var(--on-accent);
      }
      /* 9 → 10 → 100 all draw in the same box, so a verdict does not reflow the
         row and move every card on the page */
      .filters .count {
        display: inline-block;
        min-width: 3ch;
        text-align: right;
        margin-left: 6px;
        opacity: 0.7;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .msg {
        font-size: 13px;
        color: GrayText;
      }

      /* `hidden` is a UA rule, and any author `display` beats it whatever the
         specificity — without this the legend shows whether or not it is open */
      .keys {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        align-items: center;
        font-size: 12px;
        color: GrayText;
      }
      .keys[hidden] {
        display: none;
      }
      .keys kbd {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: CanvasText;
        background: ButtonFace;
        border: 1px solid ButtonBorder;
        border-radius: 4px;
        padding: 0 5px;
        margin-right: 3px;
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 20px 40vh;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .cards {
        display: flex;
        flex-direction: column;
      }
      .card {
        border-top: 1px solid ButtonBorder;
        border-left: 3px solid transparent;
        padding: 14px 0 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card[data-current='true'] {
        border-left-color: CanvasText;
      }
      .card[data-selected='true'],
      .index tr[data-selected='true'] {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
      .card {
        scroll-margin-top: calc(var(--header-h, 110px) + 10px);
      }
      .index tr {
        scroll-margin-top: calc(var(--header-h, 110px) + 80px);
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: baseline;
      }
      .chip {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--cls, var(--accent));
        color: var(--on-accent);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .model {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .genes {
        font-weight: 600;
      }
      .effect {
        color: GrayText;
      }
      .change {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      /* A ClinVar disease list runs to a paragraph: the chip keeps one line of
         it and the title has the rest. */
      .facet {
        font-size: 12px;
        white-space: nowrap;
        max-width: 48ch;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .facet b {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: GrayText;
      }
      .impact,
      .filter,
      .verdict {
        --pill: GrayText;
        display: inline-block;
        padding: 1px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--pill) 16%, transparent);
        color: var(--pill);
        font-size: 11px;
        font-weight: 600;
        line-height: 16px;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .impact[data-impact='HIGH'] {
        --pill: var(--artifact);
      }
      .impact[data-impact='MODERATE'] {
        --pill: var(--unsure);
      }
      .impact[data-impact='LOW'],
      .impact[data-impact='MODIFIER'] {
        background: none;
      }
      .filter {
        --pill: var(--unsure);
        cursor: help;
      }
      .verdict {
        background: var(--pill);
        color: var(--on-accent);
      }
      .verdict[data-tone='real'] {
        --pill: var(--real);
      }
      .verdict[data-tone='unsure'] {
        --pill: var(--unsure);
      }
      .verdict[data-tone='artifact'] {
        --pill: var(--artifact);
      }
      .verdict[data-tone='accent'] {
        --pill: var(--accent);
      }
      /* a trio's calls, a member a line, the child's first */
      .trio {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .trio .why {
        margin: 0 0 4px;
        font-size: 13px;
      }
      .trio table {
        border-collapse: collapse;
      }
      .trio th,
      .trio td {
        padding: 1px 16px 1px 0;
        text-align: left;
        font-weight: normal;
        white-space: nowrap;
      }
      .trio tr[data-role='child'] th {
        font-weight: 600;
      }
      .trio .n {
        text-align: right;
      }
      .rel,
      .dim,
      .fields-inline {
        color: GrayText;
      }
      .gt,
      .fields-inline {
        font-family: ui-monospace, monospace;
      }
      .fields-inline span {
        margin-right: 10px;
      }
      .fields-inline i {
        font-style: normal;
        color: CanvasText;
      }
      .count-reads[data-zero='true'] {
        color: GrayText;
      }
      /* what was counted off the picture, then what the caller wrote */
      .evidence {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        align-items: baseline;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .lane,
      .sample {
        display: inline-flex;
        gap: 6px;
        align-items: baseline;
      }
      .lane b {
        text-transform: capitalize;
      }
      .lane[data-zero='true'] {
        color: GrayText;
      }
      .sample {
        flex-wrap: wrap;
        margin-left: auto;
        font-family: ui-monospace, monospace;
        color: GrayText;
      }
      .sample b {
        font-family: system-ui, -apple-system, sans-serif;
        color: CanvasText;
      }
      .sample span[title] {
        cursor: help;
      }
      .sample i {
        font-style: normal;
        color: CanvasText;
      }
      details.record {
        font-size: 12px;
      }
      details.record summary,
      details.context summary,
      details.overview summary {
        cursor: pointer;
        color: GrayText;
        width: fit-content;
      }
      details.context {
        font-size: 12px;
      }
      details.context[open] summary {
        padding-bottom: 4px;
      }
      details.overview {
        margin-bottom: 12px;
        font-size: 13px;
      }
      details.overview img {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }
      .fields {
        margin: 8px 0 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 2px 24px;
        font-family: ui-monospace, monospace;
      }
      .fields div {
        display: flex;
        gap: 10px;
        min-width: 0;
      }
      .fields dt {
        flex: none;
        color: GrayText;
      }
      .fields dt[title] {
        cursor: help;
        text-decoration: underline dotted;
      }
      .fields dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .meta {
        margin-left: auto;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: GrayText;
        font-variant-numeric: tabular-nums;
      }
      .shot {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }
      /* The whole picture in the window, under the header and above the
         verdict buttons: a two-panel card is taller than a laptop screen, and a
         verdict on half a picture is a guess. The figure keeps the white the
         image is drawn on, so the scaled image has no letterbox. */
      main[data-fit='true'] .shot[data-zoom='false'] {
        cursor: zoom-in;
        /* A height and a ratio, not a max-height: an image that has not
           loaded yet has no size of its own to cap, and a card that grows when
           its picture arrives moves the queue under the cursor. */
        --room: max(360px, calc(100vh - var(--header-h, 110px) - 190px));
        --column: calc(min(100vw, 1400px) - 48px);
        height: min(
          var(--room),
          calc(var(--h) * 1px),
          calc(var(--column) * var(--h) / var(--w))
        );
        width: auto;
        aspect-ratio: var(--w) / var(--h);
        max-width: 100%;
        margin-inline: auto;
      }
      main[data-fit='true'] .shot[data-zoom='true'] {
        cursor: zoom-out;
      }
      .shot-set {
        margin: 0;
      }
      .shot-set figcaption {
        padding-bottom: 4px;
        font-size: 12px;
        color: GrayText;
      }
      button.event {
        font-size: 12px;
      }
      .missing {
        padding: 20px 0;
        color: GrayText;
        font-size: 13px;
      }
      .card-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
      }
      .verdicts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .verdicts .question {
        font-size: 13px;
        font-weight: 600;
        margin-right: 4px;
      }
      .verdicts kbd {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        opacity: 0.6;
        margin-right: 5px;
      }
      .verdicts .unanswer {
        margin-left: 6px;
      }
      .verdicts button[data-tone='real'] {
        --cls: var(--real);
      }
      .verdicts button[data-tone='unsure'] {
        --cls: var(--unsure);
      }
      .verdicts button[data-tone='artifact'] {
        --cls: var(--artifact);
      }
      .verdicts button[data-tone='accent'] {
        --cls: var(--accent);
      }
      input.note {
        flex: 1;
        min-width: 160px;
      }
      a.live {
        font-size: 13px;
        color: LinkText;
        white-space: nowrap;
      }
      /* the callset at a glance: the same queue, a line a card */
      .index {
        --rule: color-mix(in srgb, ButtonBorder 25%, transparent);
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .index caption {
        caption-side: top;
        text-align: left;
        font-size: 12px;
        color: GrayText;
        padding: 0 8px 8px;
      }
      .index caption b {
        color: CanvasText;
        font-weight: 600;
      }
      .index thead th {
        position: sticky;
        top: var(--header-h, 110px);
        z-index: 1;
        background: Canvas;
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: GrayText;
        height: 30px;
        padding: 0 8px;
        box-shadow: inset 0 -1px ButtonBorder;
        white-space: nowrap;
      }
      .index .group th {
        position: sticky;
        top: calc(var(--header-h, 110px) + 30px);
        background: Canvas;
        text-align: left;
        padding: 14px 8px 6px;
        box-shadow: inset 0 -1px ButtonBorder;
        font-weight: normal;
        cursor: default;
      }
      .index .group .tally {
        margin-left: 10px;
        font-size: 12px;
        color: GrayText;
      }
      .index td {
        height: 33px;
        padding: 0 8px;
        border-bottom: 1px solid var(--rule);
        vertical-align: middle;
        white-space: nowrap;
      }
      .index td:first-child {
        box-shadow: inset 3px 0 var(--cls, transparent);
      }
      .index .n {
        text-align: right;
      }
      .index thead .rel {
        text-transform: none;
        letter-spacing: normal;
        font-weight: normal;
      }
      .index tbody tr:not(.group) {
        cursor: pointer;
      }
      .index tbody tr:not(.group):hover {
        background: ButtonFace;
      }
      .index tr[data-current='true'] {
        outline: 1px solid CanvasText;
        outline-offset: -1px;
      }
      .index .where,
      .index .open {
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      .index .where {
        color: GrayText;
      }
      .index .where .away {
        color: CanvasText;
      }
      .index .open {
        border: 0;
        padding: 0;
        background: none;
        color: LinkText;
      }
      .index .gene-cell div {
        max-width: 22ch;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .index thead th:last-child {
        width: 100%;
      }
      .index .note-cell {
        max-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        color: GrayText;
      }
      .segmented {
        display: flex;
        align-items: center;
      }
      .seg-label {
        font-size: 12px;
        color: GrayText;
        margin-right: 6px;
      }
      .segmented button {
        position: relative;
        border-radius: 0;
        margin-left: -1px;
      }
      .segmented button:first-of-type {
        margin-left: 0;
        border-radius: 4px 0 0 4px;
      }
      .segmented button:last-of-type {
        border-radius: 0 4px 4px 0;
      }
      .segmented button[aria-pressed='true'] {
        z-index: 1;
      }
      #export[data-pending='true'] {
        color: var(--unsure);
      }
      .shown {
        font-size: 13px;
        color: GrayText;
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      .selection {
        font-size: 13px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      button.clear {
        border: 0;
        padding: 0;
        background: none;
        color: LinkText;
      }
      .empty {
        color: GrayText;
        align-self: flex-start;
      }
      footer {
        border-top: 1px solid ButtonBorder;
        padding-top: 16px;
        color: GrayText;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 78ch;
      }
      footer code {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: CanvasText;
      }
      @media (max-width: 700px) {
        .progress,
        .actions,
        .meta,
        a.live {
          margin-left: 0;
        }
        .progress {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">__APP_HTML__</div>
    <script id="portal-data" type="application/json">
      __DATA__
    </script>
    <script>
      __APP_JS__
    </script>
  </body>
</html>
