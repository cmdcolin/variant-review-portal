<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__TITLE__</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129516;</text></svg>"
    />
    <style>
      /* Surfaces, text and borders are CSS system colors, so light and dark
         both work with no palette and no media query — the browser maps
         Canvas/Field/ButtonFace per scheme. Only the accents that carry meaning
         are fixed: one colour per class, one per verdict. */
      :root {
        color-scheme: light dark;
        /* light-dark() rather than a media query, for the same reason the rest
           of the sheet is system colors: one declaration, both schemes. An
           accent picked for white is unreadable on near-black and the other way
           round, and these are borders and text, not decoration. */
        --accent: light-dark(#2563eb, #7aa2f7);
        --real: light-dark(#16a34a, #4ade80);
        --unsure: light-dark(#b45309, #fbbf24);
        --artifact: light-dark(#dc2626, #f87171);
        /* what reads on top of an accent, once the accent is the background */
        --on-accent: light-dark(#fff, #10131a);
      }
      [data-cls='SNV'] {
        --cls: light-dark(#0f766e, #5eead4);
      }
      [data-cls='MNV'] {
        --cls: light-dark(#4d7c0f, #bef264);
      }
      [data-cls='DEL'] {
        --cls: light-dark(#e41a1c, #ff8a8a);
      }
      [data-cls='DUP'] {
        --cls: light-dark(#377eb8, #8cc0f0);
      }
      [data-cls='INS'] {
        --cls: light-dark(#800080, #e08ae0);
      }
      [data-cls='INV'] {
        --cls: light-dark(#ff7f00, #ffb366);
      }
      [data-cls='CNV'] {
        --cls: light-dark(#5c3a1e, #c9a27e);
      }
      [data-cls='BND'] {
        --cls: light-dark(#a65628, #e0a078);
      }
      [data-cls='EVENT'] {
        --cls: light-dark(#0d9488, #5eead4);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      /* Full width and stuck to the top of the viewport, not a floating panel
         inside the column: every control on the page is in here, and a reviewer
         forty cards down needs all of them without scrolling back. */
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: Canvas;
        border-bottom: 1px solid ButtonBorder;
        padding: 10px 20px;
        display: flex;
        gap: 8px 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
      }
      .eyebrow {
        font-size: 12px;
        color: GrayText;
      }
      .progress {
        width: 290px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .progress .r {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        color: GrayText;
      }
      .bar {
        height: 6px;
        display: flex;
        border: 1px solid ButtonBorder;
        border-radius: 3px;
        background: ButtonFace;
        overflow: hidden;
      }
      .bar span {
        height: 100%;
      }
      .b-real {
        background: var(--real);
      }
      .b-unsure {
        background: var(--unsure);
      }
      .b-artifact {
        background: var(--artifact);
      }

      /* the filters and the actions, on their own line under the title row */
      .hrow {
        flex-basis: 100%;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .actions {
        margin-left: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      button,
      select,
      input[type='search'] {
        font: inherit;
        font-size: 13px;
        padding: 5px 10px;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        background: Canvas;
        color: CanvasText;
      }
      select,
      input[type='search'] {
        background: Field;
        color: FieldText;
      }
      input[type='search'] {
        min-width: 190px;
      }
      /* a select is as wide as its longest option, and a facet's can be a
         sentence */
      header select {
        max-width: 250px;
        text-overflow: ellipsis;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        color: GrayText;
      }
      .filters button[aria-pressed='true'] {
        background: var(--cls, var(--accent));
        border-color: var(--cls, var(--accent));
        color: var(--on-accent);
      }
      /* 9 → 10 → 100 all draw in the same box, so a verdict does not reflow the
         row and move every card on the page */
      .filters .count {
        display: inline-block;
        min-width: 3ch;
        text-align: right;
        margin-left: 6px;
        opacity: 0.7;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .msg {
        font-size: 13px;
        color: GrayText;
      }

      /* `hidden` is a UA rule, and any author `display` beats it whatever the
         specificity — without this the legend shows whether or not it is open */
      .keys {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        align-items: center;
        font-size: 12px;
        color: GrayText;
      }
      .keys[hidden] {
        display: none;
      }
      .keys kbd {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: CanvasText;
        background: ButtonFace;
        border: 1px solid ButtonBorder;
        border-radius: 4px;
        padding: 0 5px;
        margin-right: 3px;
      }

      main {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 20px 40vh;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      /* The class stripe is always 5px and only its COLOUR says which class: a
         border is layout, so growing one on a verdict would reflow the card. */
      .card {
        border: 1px solid var(--verdict, ButtonBorder);
        border-left: 5px solid var(--cls, ButtonBorder);
        border-radius: 8px;
        overflow: hidden;
      }
      .card[data-verdict='real'] {
        --verdict: var(--real);
      }
      .card[data-verdict='unsure'] {
        --verdict: var(--unsure);
      }
      .card[data-verdict='artifact'] {
        --verdict: var(--artifact);
      }
      .card,
      .index tr {
        scroll-margin-top: calc(var(--header-h, 110px) + 10px);
      }
      .card[data-current='true'] {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: baseline;
        padding: 10px 14px;
      }
      .chip {
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--cls, var(--accent));
        color: var(--on-accent);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .model {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .genes {
        font-weight: 600;
      }
      .effect {
        color: GrayText;
      }
      .change {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      /* A ClinVar disease list runs to a paragraph: the chip keeps one line of
         it and the title has the rest. */
      .facet {
        padding: 0 7px;
        border: 1px solid ButtonBorder;
        border-radius: 4px;
        font-size: 12px;
        white-space: nowrap;
        max-width: 48ch;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .facet b {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: GrayText;
      }
      .impact,
      .filter {
        padding: 0 7px;
        border: 1px solid currentColor;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        white-space: nowrap;
        color: GrayText;
      }
      .impact[data-impact='HIGH'] {
        color: var(--artifact);
      }
      .impact[data-impact='MODERATE'] {
        color: var(--unsure);
      }
      .filter {
        font-family: ui-monospace, monospace;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--unsure);
        cursor: help;
      }
      /* what was counted off the picture, then what the caller wrote */
      .evidence {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        padding: 8px 14px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .lane,
      .sample {
        display: inline-flex;
        gap: 8px;
        align-items: baseline;
        padding: 2px 10px;
        border: 1px solid ButtonBorder;
        border-radius: 999px;
      }
      .lane b,
      .sample b {
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .lane:not([data-zero='true']) {
        border-color: var(--accent);
      }
      .lane[data-zero='true'] {
        color: GrayText;
      }
      .sample {
        margin-left: auto;
        font-family: ui-monospace, monospace;
        color: GrayText;
      }
      .sample b {
        font-family: system-ui, -apple-system, sans-serif;
        text-transform: none;
        letter-spacing: 0;
      }
      .sample span[title] {
        cursor: help;
      }
      .sample i {
        font-style: normal;
        color: CanvasText;
      }
      details.record {
        padding: 8px 14px 0;
        font-size: 12px;
      }
      details.record summary {
        cursor: pointer;
        color: GrayText;
        width: fit-content;
      }
      .fields {
        margin: 8px 0 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 2px 24px;
        font-family: ui-monospace, monospace;
      }
      .fields div {
        display: flex;
        gap: 10px;
        min-width: 0;
      }
      .fields dt {
        flex: none;
        color: GrayText;
      }
      .fields dt[title] {
        cursor: help;
        text-decoration: underline dotted;
      }
      .fields dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .meta {
        margin-left: auto;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: GrayText;
        font-variant-numeric: tabular-nums;
      }
      .shot {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }
      /* The whole picture in the window, under the header and above the
         verdict buttons: a two-panel card is taller than a laptop screen, and a
         verdict on half a picture is a guess. The figure keeps the white the
         image is drawn on, so the scaled image has no letterbox. */
      main[data-fit='true'] .shot[data-zoom='false'] {
        cursor: zoom-in;
        /* A height and a ratio, not a max-height: an image that has not
           loaded yet has no size of its own to cap, and a card that grows when
           its picture arrives moves the queue under the cursor. */
        --room: max(360px, calc(100vh - var(--header-h, 110px) - 190px));
        --column: calc(min(100vw, 1400px) - 48px);
        height: min(
          var(--room),
          calc(var(--h) * 1px),
          calc(var(--column) * var(--h) / var(--w))
        );
        width: auto;
        aspect-ratio: var(--w) / var(--h);
        max-width: 100%;
        margin-inline: auto;
      }
      main[data-fit='true'] .shot[data-zoom='true'] {
        cursor: zoom-out;
      }
      .shot-set {
        margin: 0;
        background: #fff;
        border-top: 1px solid ButtonBorder;
        border-bottom: 1px solid ButtonBorder;
      }

      .shot-set figcaption {
        background: Canvas;
        padding: 10px 14px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: GrayText;
      }
      button.event {
        font: inherit;
        font-size: 12px;
        padding: 1px 8px;
        border: 1px solid ButtonBorder;
        border-radius: 999px;
        background: ButtonFace;
        color: ButtonText;
        cursor: pointer;
      }
      .missing {
        background: Canvas;
        padding: 20px 14px;
        color: GrayText;
        font-size: 13px;
      }
      .card-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding: 10px 14px;
      }
      .verdicts {
        display: flex;
        gap: 6px;
      }
      .verdicts button[data-v='real'] {
        border-color: var(--real);
        color: var(--real);
      }
      .verdicts button[data-v='unsure'] {
        border-color: var(--unsure);
        color: var(--unsure);
      }
      .verdicts button[data-v='artifact'] {
        border-color: var(--artifact);
        color: var(--artifact);
      }
      .verdicts button[aria-pressed='true'] {
        color: var(--on-accent);
      }
      .verdicts button[aria-pressed='true'][data-v='real'] {
        background: var(--real);
      }
      .verdicts button[aria-pressed='true'][data-v='unsure'] {
        background: var(--unsure);
      }
      .verdicts button[aria-pressed='true'][data-v='artifact'] {
        background: var(--artifact);
      }
      input.note {
        flex: 1;
        min-width: 160px;
        font: inherit;
        font-size: 13px;
        padding: 5px 10px;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        background: Field;
        color: FieldText;
      }
      a.live {
        font-size: 13px;
        color: LinkText;
        text-decoration: none;
        border: 1px solid ButtonBorder;
        border-radius: 6px;
        padding: 5px 12px;
        white-space: nowrap;
      }
      /* the callset at a glance: the same queue, a line a card */
      .index {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .index th {
        position: sticky;
        top: var(--header-h, 110px);
        background: Canvas;
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: GrayText;
        padding: 6px 10px;
        border-bottom: 1px solid ButtonBorder;
        white-space: nowrap;
      }
      .index td {
        padding: 5px 10px;
        border-bottom: 1px solid ButtonBorder;
        vertical-align: baseline;
      }
      .index .n {
        text-align: right;
        white-space: nowrap;
      }
      .index td[data-zero='true'] {
        color: GrayText;
      }
      .index tr {
        cursor: pointer;
      }
      .index tbody tr:hover {
        background: ButtonFace;
      }
      .index tr[data-current='true'] {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .index .where,
      .index .open {
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      /* an event of ten loci wraps between them, never inside one */
      .index .where {
        color: GrayText;
      }
      .index .where span {
        white-space: nowrap;
      }
      .index .open {
        border: 0;
        padding: 0;
        background: none;
        color: LinkText;
      }
      .index .verdict {
        font-weight: 600;
        white-space: nowrap;
      }
      .index tr[data-verdict='real'] .verdict {
        color: var(--real);
      }
      .index tr[data-verdict='unsure'] .verdict {
        color: var(--unsure);
      }
      .index tr[data-verdict='artifact'] .verdict {
        color: var(--artifact);
      }
      .index .note-cell {
        max-width: 28ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: GrayText;
      }
      .segmented {
        display: flex;
      }
      .segmented button:first-child {
        border-radius: 6px 0 0 6px;
      }
      .segmented button:last-child {
        border-radius: 0 6px 6px 0;
        border-left: 0;
      }
      .actions button[aria-pressed='true'] {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
      .shown {
        font-size: 13px;
        color: GrayText;
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }
      button.clear {
        border: 0;
        padding: 0;
        background: none;
        color: LinkText;
      }
      .empty {
        color: GrayText;
        align-self: flex-start;
      }
      footer {
        border-top: 1px solid ButtonBorder;
        padding-top: 16px;
        color: GrayText;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 78ch;
      }
      footer code {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: CanvasText;
      }
      @media (max-width: 700px) {
        .progress,
        .actions,
        .meta,
        a.live {
          margin-left: 0;
        }
        .progress {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">__APP_HTML__</div>
    <script id="portal-data" type="application/json">
      __DATA__
    </script>
    <script>
      __APP_JS__
    </script>
  </body>
</html>
